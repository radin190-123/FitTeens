<head>
    <title>FitTeens Daily workout</title>
</head>
<h1 style="width: 80%; max-width: 400px; margin: 0 auto; font-family: Inter;font-size: 60px ;">
    Daily Workout
</h1>
<body style="background:url(babyblueBG3.png)">
    <div style="width: 80%; max-width: 400px; margin: 0 auto; text-align: center;">
        <form>
            <br>
            <p style=" font-family: Inter;font-size: 60px ; color: rgb(0, 0, 0);">
                Warm up
            </p>
            <br>
            <label style="font-family: Inter;font-size: 20px;">
                <input type="checkbox" />
                30 Sec Arm circles
            </label>
            <br>
            <label style="font-family: Inter;font-size: 20px;">
                <input type="checkbox" />
                30 sec light jogging in place
            </label>
            <br>
            <label style="font-family: Inter;font-size: 20px;">
                <input type="checkbox" />
                30 sec hip circles
            </label>
            <br>
            <label style="font-family: Inter;font-size: 20px;">
                <input type="checkbox" />
                1 min jumping jacks
            </label>
            <br>
            <label style="font-family: Inter;font-size: 20px;">
                <input type="checkbox" />
                30 sec deep breaths
            </label>
            <br>
            <p style=" font-family: Inter;font-size: 60px ; color: rgb(0, 0, 0);">
                Main Workout
            </p>
            <br>
            <label style="font-family: Inter;font-size: 20px;">
                <input type="checkbox" />
                Push-ups (Regular or on knees)
            </label>
            <br>
            <label style="font-family: Inter;font-size: 20px;">
                <input type="checkbox" />
                Bodyweight squats
            </label>
            <br>
            <label style="font-family: Inter;font-size: 20px;">
                <input type="checkbox" />
                Plank (forearm or high plank)
            </label>
            <br>
            <label style="font-family: Inter;font-size: 20px;">
                <input type="checkbox" />
                Glute bridge
            </label>
            <br>
            <label style="font-family: Inter;font-size: 20px;">
                <input type="checkbox" />
                Mountain climbers
            </label>
            <br>
            <label style="font-family: Inter;font-size: 20px;">
                <input type="checkbox" />
                Superman hold (for lower back)
            </label>
            <p style="font-family: Inter;font-size: 60px ; color: rgb(0, 0, 0);">
                Choose One For Today
            </p>
            <br>
            <label style="font-family: Inter;font-size: 20px;">
                <input type="checkbox" />
                High knees
            </label>
            <br>
            <label style="font-family: Inter;font-size: 20px;">
                <input type="checkbox" />
                Burpees
            </label>
            <br>
            <label style="font-family: Inter;font-size: 20px;">
                <input type="checkbox" />
                Fast jumping jacks
            </label>
            <p style=" font-family: Inter;font-size: 20px ; color: rgb(0, 0, 0);">
                (Go for 20 sec work / 10 sec rest for 4 rounds)
            </p>
            <p style=" font-family: Inter;font-size: 60px ; color: rgb(0, 0, 0);">
                Cool-down
            </p>
            <br>
            <label style="font-family: Inter;font-size: 20px;">
                <input type="checkbox" />
                Hamstring stretch — 30 sec
            </label>
            <br>
            <label style="font-family: Inter;font-size: 20px;">
                <input type="checkbox" />
                Chest stretch — 30 sec
            </label>
            <br>
            <label style="font-family: Inter;font-size: 20px;">
                <input type="checkbox" />
                Quad stretch — 30 sec each side
            </label>
            <br>
            <label style="font-family: Inter;font-size: 20px;">
                <input type="checkbox" />
                Deep breathing — 1 min
            </label>

            
        </form>

    </div>
</body>
